events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
      access_log off;
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location ^~ /seminarios/el-sacrificio-de-los-que-no-esperan/ {
      try_files $uri $uri/ /seminarios/el-sacrificio-de-los-que-no-esperan/index.html;
    }
  }
}
